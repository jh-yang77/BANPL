DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 64
  TEST:
    BATCH_SIZE: 256
  NUM_WORKERS: 8
INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]
OPTIM:
  NAME: "sgd"
  LR: 0.002
  MAX_EPOCH: 90
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 5
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5
TRAIN:
  PRINT_FREQ: 20
  CHECKPOINT_FREQ: 30
MODEL:
  BACKBONE:
    NAME: "ViT-B/16"
TRAINER:
  BANPL:
    N_CTX: 16
    STAGE_EPOCHS: 30
    SEP_WEIGHT: 1.0
    HARD_NEG_MODE: "per_image_high_prob"
    HARD_NEG_FRACTION: 0.25
    POS_LR: 0.002
    NEG_LR: 0.002
    TWO_STAGE_LR: True
    LEGACY_COSINE_ETA_MIN: 1e-5
DATASET:
  NUM_SHOTS: 16
